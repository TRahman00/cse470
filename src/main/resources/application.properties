spring.application.name=fraudgraph
server.port=8080

# MongoDB on your own computer, database name "fraudgraph"
spring.mongodb.uri=mongodb://localhost:27017/fraudgraph
spring.data.mongodb.uri=mongodb://localhost:27017/fraudgraph

# Create the unique indexes written in the model classes
spring.data.mongodb.auto-index-creation=true

# Save BigDecimal money amounts as exact decimals in MongoDB
spring.data.mongodb.representation.big-decimal=decimal128

# Largest CSV file allowed
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
